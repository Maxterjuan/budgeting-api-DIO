    spring.application.name=budgeting

    # Banco em memoria (H2): os dados somem ao reiniciar
    spring.datasource.url=jdbc:h2:mem:budgeting
    spring.jpa.hibernate.ddl-auto=update

    # Groq (compativel com OpenAI): a chave vem de variavel de ambiente
    spring.ai.openai.base-url=https://api.groq.com/openai
    spring.ai.openai.api-key=${GROQ_API_KEY}
    spring.ai.openai.chat.options.model=openai/gpt-oss-120b
    spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
    spring.ai.openai.audio.transcription.options.language=pt
    spring.ai.openai.audio.speech.options.model=canopylabs/orpheus-v1-english
    spring.ai.openai.audio.speech.options.voice=autumn
    spring.ai.openai.audio.speech.options.response-format=wav

    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB